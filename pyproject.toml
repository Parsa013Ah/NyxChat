[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxchat"
version = "0.3.1"
description = "Nostr over Tor, in your terminal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "websocket-client>=1.6",
    "requests[socks]>=2.28",
    "cryptography>=41",
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.scripts]
nyx = "nyxchat.cli:entry"

[tool.setuptools]
packages = ["nyxchat"]
