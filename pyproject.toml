[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxchat"
version = "0.3.11"
description = "Private terminal messenger on Nostr over Tor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "NyxChat"}]
keywords = ["nostr", "tor", "messenger", "privacy", "encryption", "terminal", "tui", "chat", "decentralized", "censorship-resistance", "obfs4", "bridges", "persian", "arabic", "bidi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet",
]
dependencies = [
    "websocket-client>=1.6",
    "requests[socks]>=2.28",
    "cryptography>=41",
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.scripts]
nyx = "nyxchat.cli:entry"

[tool.setuptools]
packages = ["nyxchat"]
